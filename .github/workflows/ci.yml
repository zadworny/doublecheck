name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SC
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SC

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test

      # Compile the deployable Wasm target and enforce the network ceiling.
      # Release operations additionally use `stellar contract build --optimize`
      # and record the optimized candidate's hash.
      - name: Build Wasm
        run: cargo build --target wasm32v1-none --release

      - name: Check Wasm against the network size limit
        run: |
          WASM=target/wasm32v1-none/release/doublecheck_registry.wasm
          SIZE=$(wc -c < "$WASM")
          LIMIT=131072
          echo "$WASM: $SIZE bytes (limit $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Wasm exceeds contract_max_size_bytes"
            exit 1
          fi

  explorer:
    name: Explorer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FE/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `npm run build` runs `tsc -b` first, so this covers type checking too.
      - run: npm run build
