<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    A favicon cannot inherit a colour from the page, and browser tab bars are
    light or dark depending on the OS theme. A single white mark would vanish
    on a light tab strip, so the stroke follows prefers-color-scheme instead.
  -->
  <style>
    :root { --mark: #0f172a; }
    @media (prefers-color-scheme: dark) { :root { --mark: #f8fafc; } }
  </style>
  <rect x="4" y="4" width="56" height="56" rx="15" stroke="var(--mark)" stroke-width="4"/>
  <path d="M13 32.5 22.5 42 39 21" stroke="var(--mark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30.5 34 36.5 41 52 20" stroke="var(--mark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
